<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer 'D' Arc Gradient: Cyan -> Electric Blue -> Violet Purple -->
    <linearGradient id="documind-d-arc" x1="10" y1="10" x2="95" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="35%" stop-color="#00A3FF" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Document Primary Fill Gradient -->
    <linearGradient id="documind-doc-grad" x1="18" y1="22" x2="48" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Back Document Layer Accent -->
    <linearGradient id="documind-back-doc" x1="12" y1="28" x2="38" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Neural Synapse Gradient -->
    <linearGradient id="documind-neural-stream" x1="36" y1="35" x2="85" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glow filter for core AI node -->
    <filter id="documind-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. OUTER D-SHAPED NEURAL ENCLOSURE -->
  <path
    d="M 28 10 C 58 10 90 24 90 50 C 90 76 58 90 28 90 C 22 90 18 86 18 80 C 18 74 22 70 28 70 C 50 70 72 60 72 50 C 72 40 50 30 28 30 C 22 30 18 26 18 20 C 18 14 22 10 28 10 Z"
    fill="url(#documind-d-arc)"
    opacity="0.95"
  />

  <!-- 2. SECONDARY BACK LAYER OF DOCUMENT STACK -->
  <path
    d="M 14 36 C 14 32.5 16.5 30 20 30 L 36 30 C 38 30 40 32 40 34 L 40 70 C 40 73.5 37.5 76 34 76 L 18 76 C 15.5 76 14 74.5 14 72 Z"
    fill="url(#documind-back-doc)"
    opacity="0.65"
  />

  <!-- 3. PRIMARY FOREGROUND DOCUMENT (WITH FOLDED CORNER) -->
  <path
    d="M 22 22 C 22 18.5 24.5 16 28 16 L 40 16 L 50 26 L 50 76 C 50 79.5 47.5 82 44 82 L 28 82 C 24.5 82 22 79.5 22 76 Z"
    fill="#F8FAFC"
    stroke="#334155"
    stroke-width="1"
  />

  <!-- Document Folded Corner -->
  <path
    d="M 40 16 L 40 24 C 40 25.5 41.5 26 43 26 L 50 26 Z"
    fill="#CBD5E1"
  />

  <!-- Document Content Data Lines -->
  <rect x="28" y="34" width="14" height="3" rx="1.5" fill="#0284C7" />
  <rect x="28" y="42" width="16" height="3" rx="1.5" fill="#0284C7" />
  <rect x="28" y="50" width="12" height="3" rx="1.5" fill="#0284C7" />
  <rect x="28" y="58" width="8" height="3" rx="1.5" fill="#38BDF8" />

  <!-- 4. CONNECTING NEURAL SYNAPSE STREAMS -->
  <path
    d="M 46 35 C 54 35 58 32 64 34"
    stroke="url(#documind-neural-stream)"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M 46 43 C 55 43 60 46 66 45"
    stroke="url(#documind-neural-stream)"
    stroke-width="3"
    stroke-linecap="round"
  />
  <path
    d="M 42 51 C 52 51 58 56 65 54"
    stroke="url(#documind-neural-stream)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <rect x="52" y="29" width="3" height="3" rx="1" fill="#00E5FF" />
  <rect x="56" y="53" width="3" height="3" rx="1" fill="#A855F7" />

  <!-- 5. AI NEURAL BRAIN / MIND NETWORK -->
  <path
    d="M 64 34 L 72 28 L 80 34 L 82 46 L 76 56 L 66 58 L 65 54 L 72 46 Z"
    stroke="url(#documind-neural-stream)"
    stroke-width="1.5"
    stroke-linejoin="round"
    opacity="0.8"
  />
  <path
    d="M 72 28 L 72 46 L 82 46"
    stroke="url(#documind-neural-stream)"
    stroke-width="1.5"
    stroke-linejoin="round"
    opacity="0.7"
  />
  <path
    d="M 64 34 L 72 46 L 76 56"
    stroke="url(#documind-neural-stream)"
    stroke-width="1.5"
    stroke-linejoin="round"
    opacity="0.7"
  />

  <!-- Synapse Nodes -->
  <circle cx="72" cy="28" r="3" fill="#00E5FF" />
  <circle cx="80" cy="34" r="3" fill="#38BDF8" />
  <circle cx="72" cy="46" r="4.5" fill="#FFFFFF" filter="url(#documind-glow)" />
  <circle cx="72" cy="46" r="2.5" fill="#00E5FF" />
  <circle cx="82" cy="46" r="3" fill="#818CF8" />
  <circle cx="76" cy="56" r="3" fill="#C084FC" />
  <circle cx="64" cy="34" r="2.5" fill="#00E5FF" />
  <circle cx="66" cy="58" r="2.5" fill="#A855F7" />
</svg>
